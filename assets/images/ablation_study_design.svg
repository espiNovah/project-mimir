<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="100%" height="auto">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Scientific Experiment Design: Ablations, Controls &amp; Paired Testing</text>

  <!-- Left: Component Ablation Study Matrix -->
  <g transform="translate(35, 60)">
    <rect width="345" height="295" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="172" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">1. Component Ablation Matrix</text>
    <text x="172" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Isolating the true causal source of improvement</text>

    <!-- Table Header -->
    <rect x="15" y="55" width="315" height="26" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">Configuration</text>
    <text x="210" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Pass Rate (%)</text>
    <text x="290" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Δ Impact</text>

    <!-- Row 1: Full System -->
    <rect x="15" y="81" width="315" height="32" fill="#f0fdf4" stroke="#86efac"/>
    <text x="25" y="101" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">Full System (A+B+C)</text>
    <text x="210" y="101" font-family="monospace" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">84.2 ± 1.8%</text>
    <text x="290" y="101" font-family="monospace" font-size="10" fill="#15803d" text-anchor="middle">Base SOTA</text>

    <!-- Row 2: Remove A (Memory) -->
    <rect x="15" y="113" width="315" height="32" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="133" font-family="system-ui, sans-serif" font-size="10" fill="#334155">w/o Memory Buffer (-A)</text>
    <text x="210" y="133" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">71.0 ± 2.4%</text>
    <text x="290" y="133" font-family="monospace" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">-13.2%</text>

    <!-- Row 3: Remove B (Reflection) -->
    <rect x="15" y="145" width="315" height="32" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#334155">w/o Reflection Loop (-B)</text>
    <text x="210" y="165" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">78.5 ± 2.1%</text>
    <text x="290" y="165" font-family="monospace" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">-5.7%</text>

    <!-- Row 4: Remove C (Tool ACI) -->
    <rect x="15" y="177" width="315" height="32" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="197" font-family="system-ui, sans-serif" font-size="10" fill="#334155">w/o Custom ACI Tools (-C)</text>
    <text x="210" y="197" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">63.1 ± 2.8%</text>
    <text x="290" y="197" font-family="monospace" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">-21.1%</text>

    <!-- Row 5: Baseline -->
    <rect x="15" y="209" width="315" height="32" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="25" y="229" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Raw Prompt Baseline</text>
    <text x="210" y="229" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">52.4 ± 3.1%</text>
    <text x="290" y="229" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">-31.8%</text>

    <text x="172" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Key insight: Custom ACI (-C) drove greatest gain,</text>
    <text x="172" y="278" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">not the complex reflection loop (-B).</text>
  </g>

  <!-- Right: Paired Testing & Statistical Power -->
  <g transform="translate(420, 60)">
    <rect width="345" height="295" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="172" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">2. Paired Comparisons vs. Unpaired Noise</text>
    <text x="172" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Removing task-difficulty variance</text>

    <!-- Paired Task Diagram -->
    <rect x="20" y="60" width="305" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="172" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Identical Benchmark Tasks (T₁ ... Tₙ)</text>

    <!-- Task boxes -->
    <rect x="35" y="95" width="70" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="70" y="112" font-family="system-ui" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">Easy Task</text>
    <text x="70" y="128" font-family="system-ui" font-size="8" fill="#15803d" text-anchor="middle">Both Win (1,1)</text>

    <rect x="135" y="95" width="70" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="170" y="112" font-family="system-ui" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">Hard Task</text>
    <text x="170" y="128" font-family="system-ui" font-size="8" fill="#dc2626" text-anchor="middle">Both Fail (0,0)</text>

    <rect x="235" y="95" width="75" height="42" rx="4" fill="#fefce8" stroke="#fde047"/>
    <text x="272" y="112" font-family="system-ui" font-size="9" font-weight="700" fill="#854d0e" text-anchor="middle">Discriminative</text>
    <text x="272" y="128" font-family="system-ui" font-size="8" font-weight="700" fill="#166534" text-anchor="middle">New: 1, Base: 0</text>

    <!-- Statistical tests comparison -->
    <rect x="20" y="165" width="305" height="110" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="172" y="185" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Statistical Testing Checklist</text>
    <text x="35" y="205" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• McNemar's Test: exact p-value on paired discordance</text>
    <text x="35" y="222" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• Standard Error of Proportion: SE = sqrt( p(1-p) / N )</text>
    <text x="35" y="239" font-family="system-ui, sans-serif" font-size="9" fill="#1e3a8a">• Power Analysis: N ≥ 16·p(1-p) / Δ² for 80% power at α=0.05</text>
    <text x="35" y="258" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1d4ed8">• Reliability metric: pass^k (consistent success across all k)</text>
  </g>

  <!-- Footer Banner -->
  <rect x="35" y="360" width="730" height="22" rx="4" fill="#e2e8f0"/>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Reproducibility Rule: Fix seeds, isolate sandbox state, match token budgets, and report negative results.</text>
</svg>

