<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="100%" height="auto">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Mechanism Design: Second-Price (Vickrey) Auctions &amp; VCG Externality</text>

  <!-- Left: Second-Price Auction Truthful Bidding -->
  <g transform="translate(40, 60)">
    <rect width="330" height="295" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="165" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">Vickrey Auction (2nd Price)</text>
    <text x="165" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Truthful bidding is a Dominant Strategy</text>

    <!-- Bidders Bars -->
    <rect x="30" y="65" width="270" height="35" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="45" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Bidder 1 (Winner):</text>
    <text x="210" y="87" font-family="monospace" font-size="12" font-weight="700" fill="#1e40af">Bid b₁ = $100</text>

    <rect x="30" y="110" width="270" height="35" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="45" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Bidder 2 (Runner-up):</text>
    <text x="210" y="132" font-family="monospace" font-size="12" font-weight="700" fill="#991b1b">Bid b₂ = $70</text>

    <rect x="30" y="155" width="270" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="45" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Bidder 3:</text>
    <text x="210" y="175" font-family="monospace" font-size="11" fill="#64748b">Bid b₃ = $45</text>

    <!-- Payment Banner -->
    <rect x="25" y="200" width="280" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="165" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Payment Price = $70 (2nd Highest)</text>
    <text x="165" y="233" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Winner surplus = $100 - $70 = +$30</text>

    <!-- Intuition note -->
    <text x="165" y="262" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Bidding your true valuation v_i never hurts:</text>
    <text x="165" y="276" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Your bid affects IF you win, not WHAT you pay.</text>
  </g>

  <!-- Right: VCG Social Welfare & Externality -->
  <g transform="translate(430, 60)">
    <rect width="330" height="295" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="165" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">VCG Mechanism (Clarke Pivot)</text>
    <text x="165" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Generalizes to combinatorial allocation</text>

    <!-- Step 1: Social Welfare Maximization -->
    <rect x="25" y="65" width="280" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="165" y="83" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">1. Maximize Total Social Welfare</text>
    <text x="165" y="99" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">x* = argmax_x Σ_i v_i(x)</text>

    <!-- Step 2: Externality Payment -->
    <rect x="25" y="120" width="280" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="165" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">2. Charge Harm Done to Others (Externality)</text>
    <text x="165" y="156" font-family="monospace" font-size="10" fill="#1d4ed8" text-anchor="middle">p_i = [Welfare of others WITHOUT i]</text>
    <text x="165" y="170" font-family="monospace" font-size="10" fill="#1d4ed8" text-anchor="middle">    - [Welfare of others WITH i]</text>

    <!-- Properties badge -->
    <rect x="25" y="195" width="280" height="75" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="165" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Theoretical Guarantees</text>
    <text x="165" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle">✓ Dominant-Strategy Incentive Compatible (DSIC)</text>
    <text x="165" y="246" font-family="system-ui, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle">✓ Socially Efficient (allocative efficiency)</text>
    <text x="165" y="261" font-family="system-ui, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle">✓ Individually Rational (no forced losses)</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="360" width="720" height="22" rx="4" fill="#e2e8f0"/>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">The Revelation Principle: Any outcome achievable by any mechanism can be achieved truthfully in direct revelation.</text>
</svg>

