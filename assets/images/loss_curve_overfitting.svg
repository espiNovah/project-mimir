<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="760" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="380" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Training vs. Validation Loss: Detecting Overfitting</text>

  <!-- Axes -->
  <line x1="80" y1="290" x2="700" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="290" x2="80" y2="60" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">Training Epochs / Steps →</text>
  <text x="30" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">Loss</text>

  <!-- Zone Shading: Overfitting Zone -->
  <rect x="360" y="60" width="320" height="230" fill="#fee2e2" fill-opacity="0.4" rx="4"/>
  <text x="520" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Overfitting Zone (Memorizing Noise)</text>

  <!-- Training Loss Curve (Blue) -->
  <path d="M 90 90 Q 180 230 360 250 T 680 270" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <text x="685" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Training Loss</text>

  <!-- Validation Loss Curve (Red/Amber) -->
  <path d="M 90 120 Q 200 240 360 215 Q 460 200 680 130" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <text x="685" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">Validation Loss</text>

  <!-- Optimal Stop Point (Vertical line & dot) -->
  <line x1="360" y1="60" x2="360" y2="290" stroke="#059669" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="360" cy="215" r="6" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  
  <rect x="270" y="145" width="180" height="50" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="167" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Optimal Early Stop</text>
  <text x="360" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Lowest validation error</text>

  <!-- Legend -->
  <g transform="translate(110, 80)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#2563eb" stroke-width="3"/>
    <text x="38" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Training Loss (keeps falling)</text>
    <line x1="0" y1="30" x2="30" y2="30" stroke="#dc2626" stroke-width="3"/>
    <text x="38" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">Validation Loss (rebound = overfit)</text>
  </g>
</svg>

