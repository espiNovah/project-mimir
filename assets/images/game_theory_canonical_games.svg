<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto">
  <!-- Background Card -->
  <rect width="800" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Canonical 2x2 Normal-Form Games &amp; Strategic Equilibria</text>

  <!-- Left: Prisoner's Dilemma -->
  <g transform="translate(40, 60)">
    <rect width="330" height="310" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="165" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">1. The Prisoner's Dilemma</text>
    <text x="165" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Defection dominates; Pareto sub-optimal equilibrium</text>

    <!-- Column labels (Player 2: Blue) -->
    <text x="145" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Cooperate (C)</text>
    <text x="250" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Defect (D)</text>

    <!-- Row labels (Player 1: Red) -->
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">Cooperate (C)</text>
    <text x="65" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">Defect (D)</text>

    <!-- Grid Table -->
    <!-- Cell (C, C): (3, 3) Social Optimum -->
    <rect x="90" y="90" width="105" height="70" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="125" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">3,</text>
    <text x="150" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">3</text>
    <text x="142" y="152" font-family="system-ui" font-size="9" fill="#16a34a" text-anchor="middle">Pareto Optimum</text>

    <!-- Cell (C, D): (0, 5) -->
    <rect x="200" y="90" width="105" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="235" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">0,</text>
    <text x="260" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">5</text>

    <!-- Cell (D, C): (5, 0) -->
    <rect x="90" y="165" width="105" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">5,</text>
    <text x="150" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">0</text>

    <!-- Cell (D, D): (1, 1) Unique Nash Equilibrium -->
    <rect x="200" y="165" width="105" height="70" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="235" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">1,</text>
    <text x="260" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">1</text>
    <text x="252" y="227" font-family="system-ui" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">Nash Equilibrium</text>

    <text x="165" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Payoffs: (Player 1 [Red], Player 2 [Blue])</text>
    <rect x="20" y="272" width="290" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="165" y="289" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Strictly Dominant Strategy for both: Defect</text>
  </g>

  <!-- Right: The Stag Hunt -->
  <g transform="translate(430, 60)">
    <rect width="330" height="310" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="165" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">2. The Stag Hunt (Coordination)</text>
    <text x="165" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Payoff dominance vs. Risk dominance</text>

    <!-- Column labels (Player 2: Blue) -->
    <text x="145" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Stag (S)</text>
    <text x="250" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Hare (H)</text>

    <!-- Row labels (Player 1: Red) -->
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">Stag (S)</text>
    <text x="65" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">Hare (H)</text>

    <!-- Grid Table -->
    <!-- Cell (S, S): (4, 4) Payoff Dominant NE -->
    <rect x="90" y="90" width="105" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="125" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">4,</text>
    <text x="150" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">4</text>
    <text x="142" y="152" font-family="system-ui" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Payoff-Dominant NE</text>

    <!-- Cell (S, H): (0, 3) -->
    <rect x="200" y="90" width="105" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="235" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">0,</text>
    <text x="260" y="132" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">3</text>

    <!-- Cell (H, S): (3, 0) -->
    <rect x="90" y="165" width="105" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">3,</text>
    <text x="150" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">0</text>

    <!-- Cell (H, H): (3, 3) Risk Dominant NE -->
    <rect x="200" y="165" width="105" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="235" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#dc2626">3,</text>
    <text x="260" y="207" font-family="monospace" font-size="15" font-weight="700" fill="#2563eb">3</text>
    <text x="252" y="227" font-family="system-ui" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Risk-Dominant NE</text>

    <text x="165" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Two Pure Nash Equilibria: (S, S) and (H, H)</text>
    <rect x="20" y="272" width="290" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="165" y="289" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Stag requires trust; Hare is safe from betrayal</text>
  </g>
</svg>

