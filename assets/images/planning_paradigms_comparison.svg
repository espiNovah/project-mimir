<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="auto">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9333ea" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="840" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="420" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Evolution of LLM Planning &amp; Reasoning Paradigms</text>

  <!-- 1. Chain-of-Thought (Linear) -->
  <g transform="translate(25, 60)">
    <rect width="180" height="310" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Chain-of-Thought</text>
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Wei et al. (2022)</text>

    <!-- Linear sequence of thought bubbles -->
    <rect x="25" y="60" width="130" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="90" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">Input Prompt</text>

    <path d="M 90 92 L 90 115" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="25" y="115" width="130" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="90" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Thought Step 1</text>

    <path d="M 90 147 L 90 170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="25" y="170" width="130" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="90" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Thought Step 2</text>

    <path d="M 90 202 L 90 225" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="25" y="225" width="130" height="32" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text x="90" y="245" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Final Answer</text>

    <text x="90" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">No backtracking</text>
    <text x="90" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Single linear trajectory</text>
  </g>

  <!-- 2. ReAct (Thought-Action-Observation) -->
  <g transform="translate(225, 60)">
    <rect width="180" height="310" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">ReAct Paradigm</text>
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Yao et al. (2022)</text>

    <rect x="20" y="60" width="140" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="90" y="79" font-family="system-ui, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Thought: "I need to..."</text>

    <path d="M 90 90 L 90 110" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="20" y="110" width="140" height="30" rx="6" fill="#dcfce7" stroke="#4ade80"/>
    <text x="90" y="129" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Action: tool_call()</text>

    <path d="M 90 140 L 90 160" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="20" y="160" width="140" height="30" rx="6" fill="#bbf7d0" stroke="#22c55e"/>
    <text x="90" y="179" font-family="system-ui, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Observation: stdout</text>

    <!-- Cycle back arrow -->
    <path d="M 160 175 Q 175 125 160 75" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-green)"/>

    <rect x="20" y="215" width="140" height="30" rx="6" fill="#86efac" stroke="#16a34a"/>
    <text x="90" y="234" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Finish(Response)</text>

    <text x="90" y="275" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Grounds thought in tools</text>
    <text x="90" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Interleaved observation</text>
  </g>

  <!-- 3. Tree of Thoughts (Search over states) -->
  <g transform="translate(425, 60)">
    <rect width="180" height="310" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">Tree of Thoughts</text>
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle">Yao et al. (2023)</text>

    <!-- Branching tree -->
    <circle cx="90" cy="70" r="12" fill="#9333ea"/>
    <line x1="90" y1="82" x2="55" y2="115" stroke="#9333ea" stroke-width="1.5"/>
    <line x1="90" y1="82" x2="125" y2="115" stroke="#9333ea" stroke-width="1.5"/>

    <circle cx="55" cy="115" r="10" fill="#c084fc"/>
    <circle cx="125" cy="115" r="10" fill="#e9d5ff" stroke="#a855f7"/>

    <line x1="55" y1="125" x2="35" y2="160" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="55" y1="125" x2="75" y2="160" stroke="#16a34a" stroke-width="2"/>

    <!-- Dead end cross -->
    <circle cx="35" cy="160" r="8" fill="#fca5a5"/>
    <text x="35" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">✕</text>

    <!-- Pruned / Backtrack -->
    <text x="35" y="180" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">Pruned</text>

    <!-- Success path -->
    <circle cx="75" cy="160" r="9" fill="#86efac" stroke="#16a34a"/>

    <line x1="75" y1="169" x2="75" y2="205" stroke="#16a34a" stroke-width="2"/>
    <circle cx="75" cy="205" r="9" fill="#22c55e"/>

    <text x="90" y="245" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#6b21a8" text-anchor="middle">Heuristic Self-Evaluation</text>
    <text x="90" y="260" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">BFS / DFS / Backtracking</text>
    <text x="90" y="275" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Discovers valid solutions</text>
    <text x="90" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">High token cost</text>
  </g>

  <!-- 4. LLM-Modulo & LLM+P (Hybrid with Classical Planners) -->
  <g transform="translate(625, 60)">
    <rect width="190" height="310" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="95" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">LLM-Modulo / LLM+P</text>
    <text x="95" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Kambhampati / Liu (2023-24)</text>

    <!-- LLM Generator -->
    <rect x="20" y="60" width="150" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="95" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">LLM Generator</text>
    <text x="95" y="92" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">Natural Language → PDDL</text>

    <!-- Candidate plan arrow -->
    <path d="M 95 100 L 95 130" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- External Verifier / Classical Planner -->
    <rect x="20" y="130" width="150" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="95" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Classical Planner / VAL</text>
    <text x="95" y="162" font-family="system-ui, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Fast Downward (A* / h^+)</text>
    <text x="95" y="174" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Provably Sound Guarantee</text>

    <!-- Feedback loop back to LLM -->
    <path d="M 170 155 Q 185 108 170 80" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>

    <rect x="20" y="215" width="150" height="35" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="95" y="232" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Verified Executable Plan</text>
    <text x="95" y="244" font-family="system-ui, sans-serif" font-size="9" fill="#059669" text-anchor="middle">Zero hallucinated steps</text>

    <text x="95" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">LLM generates candidates;</text>
    <text x="95" y="295" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Sound verifier enforces truth</text>
  </g>
</svg>

