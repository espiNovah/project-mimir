<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="800" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left: Linear Function -->
  <g transform="translate(60, 40)">
    <text x="130" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Linear: Constant Slope</text>
    <text x="130" y="20" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">f(x) = 2x + 1 (slope = 2 everywhere)</text>

    <!-- Axes -->
    <line x1="30" y1="240" x2="270" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="60" y1="260" x2="60" y2="40" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="265" y="258" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">x</text>
    <text x="45" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">y</text>

    <!-- Line: (0, 1) -> (50, 215), (1, 3) -> (120, 165), (2, 5) -> (190, 115) -->
    <line x1="40" y1="225" x2="220" y2="95" stroke="#2563eb" stroke-width="3"/>

    <!-- Points -->
    <circle cx="60" cy="210" r="4" fill="#2563eb"/>
    <text x="70" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">(0, 1)</text>

    <circle cx="120" cy="165" r="4" fill="#2563eb"/>
    <text x="130" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">(1, 3)</text>

    <circle cx="180" cy="120" r="4" fill="#2563eb"/>
    <text x="190" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">(2, 5)</text>

    <!-- Slope triangle -->
    <line x1="120" y1="165" x2="180" y2="165" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="180" y1="165" x2="180" y2="120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Δx = 1</text>
    <text x="205" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#d97706">Δy = 2</text>
  </g>

  <!-- Divider -->
  <line x1="400" y1="30" x2="400" y2="330" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Right: Non-Linear Curve & Tangents -->
  <g transform="translate(460, 40)">
    <text x="130" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Non-Linear: Changing Derivatives</text>
    <text x="130" y="20" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">f(x) = x² (slope changes at every point)</text>

    <!-- Axes -->
    <line x1="20" y1="210" x2="260" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="140" y1="260" x2="140" y2="40" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="255" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">x</text>
    <text x="125" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">y</text>

    <!-- Parabola: vertex at (140, 210) -->
    <path d="M 60 70 Q 140 250 220 70" fill="none" stroke="#2563eb" stroke-width="3"/>

    <!-- Tangent at x = -2 (negative slope) -->
    <line x1="60" y1="70" x2="110" y2="190" stroke="#ef4444" stroke-width="2"/>
    <circle cx="85" cy="130" r="4" fill="#ef4444"/>
    <text x="35" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">Slope &lt; 0</text>
    <text x="35" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">Step right →</text>

    <!-- Tangent at x = 0 (minimum, slope = 0) -->
    <line x1="100" y1="210" x2="180" y2="210" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="140" cy="210" r="4" fill="#10b981"/>
    <text x="140" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">Slope = 0</text>
    <text x="140" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Minimum reached</text>

    <!-- Tangent at x = 2 (positive slope) -->
    <line x1="170" y1="190" x2="220" y2="70" stroke="#ef4444" stroke-width="2"/>
    <circle cx="195" cy="130" r="4" fill="#ef4444"/>
    <text x="210" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">Slope &gt; 0</text>
    <text x="210" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">← Step left</text>
  </g>
</svg>

