<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="100%" height="auto">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="820" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Monte Carlo Tree Search (MCTS): The Four Core Phases</text>

  <!-- Phase 1: Selection -->
  <g transform="translate(25, 55)">
    <rect width="180" height="275" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Selection</text>
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Traverse via UCB1/PUCT</text>

    <!-- Root -->
    <circle cx="90" cy="70" r="14" fill="#2563eb"/>
    <text x="90" y="74" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Root</text>

    <!-- Tree branches -->
    <line x1="90" y1="84" x2="55" y2="125" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="90" y1="84" x2="125" y2="125" stroke="#94a3b8" stroke-width="1.5"/>

    <circle cx="55" cy="125" r="12" fill="#2563eb"/>
    <circle cx="125" cy="125" r="12" fill="#cbd5e1"/>

    <line x1="55" y1="137" x2="35" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="55" y1="137" x2="75" y2="180" stroke="#2563eb" stroke-width="2.5"/>

    <circle cx="35" cy="180" r="10" fill="#cbd5e1"/>
    <circle cx="75" cy="180" r="10" fill="#2563eb"/>

    <!-- Selection Arrow -->
    <path d="M 120 70 Q 150 120 100 180" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>

    <rect x="15" y="215" width="150" height="45" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="90" y="232" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">Follow highest UCB child</text>
    <text x="90" y="246" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1e3a8a" text-anchor="middle">until leaf node reached</text>
  </g>

  <!-- Phase 2: Expansion -->
  <g transform="translate(220, 55)">
    <rect width="180" height="275" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a16207" text-anchor="middle">2. Expansion</text>
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#ca8a04" text-anchor="middle">Add new child state</text>

    <!-- Tree -->
    <circle cx="90" cy="70" r="14" fill="#64748b"/>
    <line x1="90" y1="84" x2="55" y2="125" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="55" cy="125" r="12" fill="#64748b"/>
    <line x1="55" y1="137" x2="75" y2="180" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="75" cy="180" r="10" fill="#64748b"/>

    <!-- Expansion edge & new child -->
    <line x1="75" y1="190" x2="105" y2="215" stroke="#d97706" stroke-width="2.5" stroke-dasharray="3 2" marker-end="url(#arrow-amber)"/>
    <circle cx="115" cy="225" r="13" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    <text x="115" y="229" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">New</text>

    <rect x="15" y="248" width="150" height="20" rx="4" fill="#ffffff" stroke="#fde047"/>
    <text x="90" y="262" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#854d0e" text-anchor="middle">Expand unexplored action</text>
  </g>

  <!-- Phase 3: Simulation (Rollout) -->
  <g transform="translate(415, 55)">
    <rect width="180" height="275" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">3. Simulation (Rollout)</text>
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Simulate to terminal state</text>

    <!-- Tree truncated -->
    <circle cx="90" cy="70" r="12" fill="#94a3b8"/>
    <circle cx="55" cy="120" r="10" fill="#94a3b8"/>
    <circle cx="75" cy="165" r="9" fill="#94a3b8"/>

    <!-- Expanded Node -->
    <circle cx="100" cy="190" r="11" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>

    <!-- Rollout wavy trajectory line -->
    <path d="M 100 201 Q 120 220 90 235 T 120 255" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arrow-green)"/>

    <!-- Terminal Reward -->
    <rect x="100" y="258" width="55" height="18" rx="3" fill="#15803d"/>
    <text x="127" y="271" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Reward R</text>
  </g>

  <!-- Phase 4: Backpropagation -->
  <g transform="translate(610, 55)">
    <rect width="180" height="275" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">4. Backpropagation</text>
    <text x="90" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Update N(s) and Q(s)</text>

    <!-- Tree -->
    <circle cx="90" cy="70" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="90" y="74" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">N++, Q</text>

    <line x1="90" y1="84" x2="55" y2="125" stroke="#dc2626" stroke-width="2"/>
    <circle cx="55" cy="125" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <line x1="55" y1="137" x2="75" y2="180" stroke="#dc2626" stroke-width="2"/>
    <circle cx="75" cy="180" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <circle cx="105" cy="215" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <!-- Backprop arrows pointing UP -->
    <path d="M 125 215 L 95 180" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 65 170 L 45 140" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M 65 115 L 90 90" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

    <rect x="15" y="240" width="150" height="26" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="90" y="256" font-family="monospace" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Q ← Q + (R - Q) / N</text>
  </g>

  <!-- Footer UCB1 formula -->
  <rect x="60" y="342" width="700" height="28" rx="4" fill="#e2e8f0"/>
  <text x="410" y="361" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Upper Confidence Bound for Trees: UCT(s, a) = Q(s, a) + c · sqrt( ln(N(s)) / N(s, a) )</text>
</svg>

