<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="auto">
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="720" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Orthogonal Projection &amp; Ordinary Least Squares</text>

  <!-- Left: Geometric Projection Diagram -->
  <g transform="translate(40, 60)">
    <!-- Subspace Plane C(A) -->
    <polygon points="40,240 240,240 340,150 140,150" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="70" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857">Subspace C(A)</text>
    <text x="70" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#059669">(Column Space of A)</text>

    <!-- Origin O -->
    <circle cx="100" cy="210" r="5" fill="#1e293b"/>
    <text x="85" y="225" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">0</text>

    <!-- Vector p = A * x_hat (in plane) -->
    <line x1="100" y1="210" x2="230" y2="185" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="160" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">p = A x̂</text>
    <text x="150" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">Closest point in C(A) to b</text>

    <!-- Vector b (out of plane) -->
    <line x1="100" y1="210" x2="230" y2="65" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow-navy)"/>
    <text x="145" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Target Vector b</text>

    <!-- Error vector e = b - p (vertical orthogonal) -->
    <line x1="230" y1="185" x2="230" y2="70" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
    <text x="242" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">e = b - A x̂</text>
    <text x="242" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">(Orthogonal Error)</text>

    <!-- Right angle indicator at p -->
    <path d="M 230 170 L 218 172 L 218 187" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="224" cy="178" r="1.5" fill="#64748b"/>
  </g>

  <!-- Right: Algebraic Derivation & Normal Equations -->
  <g transform="translate(420, 65)">
    <rect width="260" height="275" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Orthogonality Condition</text>

    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#475569">The error e must be orthogonal to</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#475569">every column vector of matrix A:</text>

    <rect x="15" y="82" width="230" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="130" y="102" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Aᵀ · (b - A x̂) = 0</text>

    <text x="20" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Expanding the inner product:</text>
    <text x="35" y="152" font-family="monospace" font-size="11" fill="#334155">Aᵀ·b - Aᵀ·A·x̂ = 0</text>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">The Normal Equations:</text>
    <rect x="15" y="190" width="230" height="32" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="130" y="211" font-family="monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Aᵀ A x̂ = Aᵀ b</text>

    <text x="20" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Closed-form projection formula:</text>
    <rect x="15" y="250" width="230" height="32" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="130" y="271" font-family="monospace" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">x̂ = (Aᵀ A)⁻¹ Aᵀ b</text>
  </g>
</svg>

