<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="760" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="380" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Bi-Encoder Architecture &amp; In-Batch Contrastive Learning</text>

  <!-- Left: Bi-encoder pipeline -->
  <g transform="translate(40, 60)">
    <text x="140" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">1. Independent Encoding</text>

    <!-- Query -->
    <rect x="20" y="30" width="240" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="140" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Query: "Reset auth password"</text>
    <line x1="140" y1="66" x2="140" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="40" y="95" width="200" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="118" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">BERT / Transformer Encoder</text>
    <line x1="140" y1="131" x2="140" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Document -->
    <rect x="20" y="240" width="240" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="140" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Document: "Navigate to security..."</text>
    <line x1="140" y1="240" x2="140" y2="211" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="40" y="175" width="200" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">BERT / Transformer Encoder</text>

    <!-- Middle: Dot product circle -->
    <circle cx="280" cy="153" r="22" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <text x="280" y="159" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">q · d</text>
    <path d="M 240 113 L 260 143" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 240 193 L 260 163" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Divider -->
  <line x1="390" y1="50" x2="390" y2="350" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Right: In-batch negatives matrix -->
  <g transform="translate(420, 60)">
    <text x="150" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">2. MultipleNegativesRankingLoss Matrix</text>

    <text x="150" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Diagonal = positive pairs | Off-diagonal = in-batch negatives</text>

    <!-- Column Headers (Passages) -->
    <text x="75" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Doc 1</text>
    <text x="150" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Doc 2</text>
    <text x="225" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Doc 3</text>

    <!-- Row 1 (Query 1) -->
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">Query 1</text>
    <rect x="40" y="80" width="70" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="75" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">+ Target</text>

    <rect x="115" y="80" width="70" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="150" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">- Neg</text>

    <rect x="190" y="80" width="70" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="225" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">- Neg</text>

    <!-- Row 2 (Query 2) -->
    <text x="20" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">Query 2</text>
    <rect x="40" y="140" width="70" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="75" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">- Neg</text>

    <rect x="115" y="140" width="70" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="150" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">+ Target</text>

    <rect x="190" y="140" width="70" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="225" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">- Neg</text>

    <!-- Row 3 (Query 3) -->
    <text x="20" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">Query 3</text>
    <rect x="40" y="200" width="70" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="75" y="232" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">- Neg</text>

    <rect x="115" y="200" width="70" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="150" y="232" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle">- Neg</text>

    <rect x="190" y="200" width="70" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="225" y="232" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">+ Target</text>

    <text x="150" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#059669" text-anchor="middle">Batch of 64 provides 1 positive + 63 negatives per query</text>
  </g>
</svg>

