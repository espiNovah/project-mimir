<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="auto">
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="780" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Proximal Policy Optimization (PPO): Clipped Surrogate Objective</text>

  <!-- Left Chart: Positive Advantage (A_hat > 0) -->
  <g transform="translate(50, 60)">
    <rect width="320" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="160" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Positive Advantage (Â &gt; 0)</text>
    <text x="160" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Action was better than average</text>

    <!-- Axes -->
    <line x1="40" y1="240" x2="300" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <line x1="140" y1="260" x2="140" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <text x="290" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">r(θ)</text>
    <text x="120" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Loss</text>

    <!-- r = 1, 1-eps, 1+eps markers -->
    <line x1="140" y1="237" x2="140" y2="243" stroke="#475569" stroke-width="2"/>
    <text x="140" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">1.0</text>

    <line x1="90" y1="237" x2="90" y2="243" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="90" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1-ε</text>

    <line x1="210" y1="237" x2="210" y2="243" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="210" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1+ε</text>

    <!-- Unclipped objective r * A (dashed line) -->
    <line x1="40" y1="210" x2="280" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="260" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">r · Â</text>

    <!-- Clipped Objective Line (Green solid) -->
    <!-- Ramps up to 1+eps, then plateaus flat -->
    <line x1="40" y1="210" x2="210" y2="125" stroke="#16a34a" stroke-width="3"/>
    <line x1="210" y1="125" x2="290" y2="125" stroke="#16a34a" stroke-width="3"/>

    <!-- Point at 1+eps -->
    <circle cx="210" cy="125" r="4" fill="#15803d"/>
    <text x="210" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">(1+ε)·Â</text>

    <!-- Annotation banner -->
    <rect x="180" y="145" width="115" height="40" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <text x="237" y="160" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Clipped plateau</text>
    <text x="237" y="174" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Prevents excessive update</text>
  </g>

  <!-- Right Chart: Negative Advantage (A_hat < 0) -->
  <g transform="translate(410, 60)">
    <rect width="320" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="160" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">Negative Advantage (Â &lt; 0)</text>
    <text x="160" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Action was worse than average</text>

    <!-- Axes -->
    <line x1="40" y1="140" x2="300" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <line x1="140" y1="260" x2="140" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
    <text x="290" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">r(θ)</text>
    <text x="120" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Loss</text>

    <!-- r = 1, 1-eps, 1+eps markers -->
    <line x1="140" y1="137" x2="140" y2="143" stroke="#475569" stroke-width="2"/>
    <text x="140" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">1.0</text>

    <line x1="90" y1="137" x2="90" y2="143" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="90" y="155" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1-ε</text>

    <line x1="210" y1="137" x2="210" y2="143" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="210" y="155" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1+ε</text>

    <!-- Unclipped objective r * A (dashed line) -->
    <line x1="40" y1="100" x2="280" y2="240" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="260" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">r · Â</text>

    <!-- Clipped Objective Line (Red solid) -->
    <!-- Flat until 1-eps, then drops down along r*A -->
    <line x1="40" y1="165" x2="90" y2="165" stroke="#dc2626" stroke-width="3"/>
    <line x1="90" y1="165" x2="250" y2="255" stroke="#dc2626" stroke-width="3"/>

    <!-- Point at 1-eps -->
    <circle cx="90" cy="165" r="4" fill="#b91c1c"/>
    <text x="80" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">(1-ε)·Â</text>

    <!-- Annotation banner -->
    <rect x="45" y="80" width="125" height="40" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="107" y="95" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Clipped ceiling</text>
    <text x="107" y="109" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Never rewards bad actions</text>
  </g>

  <!-- Footer Formula -->
  <rect x="50" y="355" width="680" height="30" rx="4" fill="#e2e8f0"/>
  <text x="390" y="375" font-family="monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">L_CLIP(θ) = E_t [ min( r_t(θ)·Â_t,  clip(r_t(θ), 1 - ε, 1 + ε)·Â_t ) ]</text>
</svg>

