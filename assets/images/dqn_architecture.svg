<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="auto">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="780" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Deep Q-Network (DQN) Architecture: Replay Buffer &amp; Target Network</text>

  <!-- Environment & Agent Interaction (Left) -->
  <g transform="translate(30, 60)">
    <rect width="200" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Environment Interaction</text>

    <!-- State & Reward -->
    <rect x="20" y="42" width="160" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="100" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">State s_t, Reward r_t</text>

    <!-- Action -->
    <rect x="20" y="95" width="160" height="35" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="100" y="117" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Action a_t ~ ε-greedy</text>
  </g>

  <!-- Replay Buffer (Center-Left) -->
  <g transform="translate(30, 245)">
    <rect width="200" height="145" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="100" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Experience Replay Buffer D</text>
    <text x="100" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Stores (s, a, r, s', done)</text>

    <!-- Transition slots -->
    <rect x="20" y="55" width="160" height="18" rx="3" fill="#ffffff" stroke="#d97706"/>
    <text x="100" y="68" font-family="monospace" font-size="9" fill="#78350f" text-anchor="middle">(s_t-2, a_t-2, r_t-2, s_t-1)</text>

    <rect x="20" y="80" width="160" height="18" rx="3" fill="#ffffff" stroke="#d97706"/>
    <text x="100" y="93" font-family="monospace" font-size="9" fill="#78350f" text-anchor="middle">(s_t-1, a_t-1, r_t-1, s_t)</text>

    <rect x="20" y="105" width="160" height="18" rx="3" fill="#fef08a" stroke="#d97706"/>
    <text x="100" y="118" font-family="monospace" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">(s_t, a_t, r_t+1, s_t+1)</text>

    <!-- Break Correlation tag -->
    <text x="100" y="137" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#92400e" text-anchor="middle">Breaks temporal autocorrelation</text>
  </g>

  <!-- Store transition arrow -->
  <path d="M 130 210 L 130 240" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Batch sample arrow -->
  <path d="M 230 315 L 295 315 L 295 190 L 320 190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="300" y="260" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb" transform="rotate(-90 300 260)">Random Mini-Batch</text>

  <!-- Online Q-Network (Upper Right) -->
  <g transform="translate(330, 60)">
    <rect width="210" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="105" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Online Q-Network Q(s, a; θ)</text>
    <text x="105" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Updated Every Gradient Step</text>

    <rect x="20" y="55" width="170" height="48" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="105" y="74" font-family="monospace" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Input: state s</text>
    <text x="105" y="93" font-family="monospace" font-size="11" fill="#1d4ed8" text-anchor="middle">Output: Q(s, a; θ) ∀ a</text>
  </g>

  <!-- Target Q-Network (Lower Right) -->
  <g transform="translate(330, 245)">
    <rect width="210" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="105" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">Target Q-Network Q(s', a'; θ⁻)</text>
    <text x="105" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Frozen / Slowly Updated</text>

    <rect x="20" y="55" width="170" height="48" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="105" y="74" font-family="monospace" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Input: next state s'</text>
    <text x="105" y="93" font-family="monospace" font-size="11" fill="#15803d" text-anchor="middle">max_a' Q(s', a'; θ⁻)</text>
  </g>

  <!-- Periodic Target Sync Arrow -->
  <path d="M 435 180 L 435 240" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>
  <text x="445" y="215" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Copy θ → θ⁻ every C steps</text>

  <!-- Loss & TD Error Computation (Far Right) -->
  <g transform="translate(580, 110)">
    <rect width="170" height="200" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="85" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">TD Loss Computation</text>

    <!-- Target y -->
    <rect x="15" y="42" width="140" height="42" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <text x="85" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Target y:</text>
    <text x="85" y="75" font-family="monospace" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">r + γ max_a' Q(s', a'; θ⁻)</text>

    <!-- Current Q -->
    <rect x="15" y="92" width="140" height="35" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="85" y="106" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Current Estimate:</text>
    <text x="85" y="120" font-family="monospace" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Q(s, a; θ)</text>

    <!-- Loss -->
    <rect x="15" y="135" width="140" height="50" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="85" y="152" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">MSE Loss L(θ):</text>
    <text x="85" y="172" font-family="monospace" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">[y - Q(s, a; θ)]²</text>
  </g>

  <!-- Arrows into Loss computation -->
  <path d="M 540 120 L 575 120" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 540 305 L 560 305 L 560 170 L 575 170" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Gradient Step Arrow back to Online Q -->
  <path d="M 665 110 L 665 48 L 470 48 L 470 55" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-red)"/>
  <text x="560" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">∇_θ L(θ) updates Online Q</text>

  <!-- Deadly Triad Footer Banner -->
  <rect x="30" y="380" width="720" height="26" rx="4" fill="#fee2e2"/>
  <text x="390" y="397" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">The Deadly Triad: Function Approximation + Bootstrapping + Off-Policy Learning. Solved by Replay Buffer + Target Network.</text>
</svg>

