<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="auto">
  <rect width="760" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="380" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Static Sequential Batching vs. vLLM Continuous Batching</text>

  <!-- Top: Static Sequential (Ollama / Naive) -->
  <g transform="translate(40, 50)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">1. Sequential Execution (Desktop / Naive)</text>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Requests queue sequentially. GPU sits idle while waiting for memory stalls.</text>

    <!-- Request 1 -->
    <rect x="0" y="55" width="220" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="73" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Request 1 (Generating...)</text>

    <!-- Request 2 Idle / Wait -->
    <rect x="230" y="55" width="180" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="320" y="73" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Request 2 (Queued)</text>

    <!-- Request 3 Idle / Wait -->
    <rect x="420" y="55" width="220" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="530" y="73" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Request 3 (Queued)</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="175" x2="720" y2="175" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Bottom: Continuous Iteration-Level Batching (vLLM) -->
  <g transform="translate(40, 195)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#059669">2. Continuous Batching (vLLM Engine)</text>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Iteration-level forward passes: as soon as one request finishes, the next is immediately scheduled.</text>

    <!-- Iteration grid -->
    <g transform="translate(0, 50)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="140" height="22" rx="3" fill="#dbeafe" stroke="#2563eb"/>
      <text x="70" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Req 1: Token 1</text>
      
      <rect x="0" y="26" width="140" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/>
      <text x="70" y="41" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Req 2: Prefill</text>

      <rect x="0" y="52" width="140" height="22" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="70" y="67" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle">Req 3: Token 12</text>

      <!-- Step 2 -->
      <rect x="150" y="0" width="140" height="22" rx="3" fill="#dbeafe" stroke="#2563eb"/>
      <text x="220" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Req 1: Token 2</text>
      
      <rect x="150" y="26" width="140" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/>
      <text x="220" y="41" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Req 2: Token 1</text>

      <rect x="150" y="52" width="140" height="22" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="220" y="67" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle">Req 3: Done [EOS]</text>

      <!-- Step 3 (Req 3 finished -> Req 4 instantly takes its place) -->
      <rect x="300" y="0" width="140" height="22" rx="3" fill="#dbeafe" stroke="#2563eb"/>
      <text x="370" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Req 1: Token 3</text>
      
      <rect x="300" y="26" width="140" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/>
      <text x="370" y="41" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Req 2: Token 2</text>

      <rect x="300" y="52" width="140" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="370" y="67" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Req 4: Prefill (New!)</text>

      <text x="500" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">GPU utilization stays at 100%</text>
    </g>
  </g>
</svg>

