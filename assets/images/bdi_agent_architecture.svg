<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9333ea" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Belief-Desire-Intention (BDI) Practical Reasoning Architecture</text>

  <!-- Left: Environment Boundary -->
  <g transform="translate(30, 60)">
    <rect width="140" height="320" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Environment</text>

    <!-- Sensors -->
    <rect x="15" y="60" width="110" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="70" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Sensors</text>
    <text x="70" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Percepts (p)</text>

    <!-- Actuators -->
    <rect x="15" y="220" width="110" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="70" y="242" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Actuators</text>
    <text x="70" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Actions (a)</text>
  </g>

  <!-- Central BDI Mental State Boxes -->
  <g transform="translate(220, 60)">
    <!-- 1. Beliefs Box -->
    <rect x="0" y="0" width="220" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Beliefs (B)</text>
    <text x="110" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">What the agent believes true</text>
    <rect x="15" y="52" width="190" height="30" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="105" y="71" font-family="monospace" font-size="10" fill="#1e3a8a" text-anchor="middle">B' = BeliefRevision(B, p)</text>

    <!-- 2. Desires Box -->
    <rect x="0" y="115" width="220" height="95" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="110" y="139" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">Desires / Goals (D)</text>
    <text x="110" y="157" font-family="system-ui, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle">What the agent wants to achieve</text>
    <rect x="15" y="167" width="190" height="30" rx="4" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="105" y="186" font-family="monospace" font-size="10" fill="#581c87" text-anchor="middle">Options(B, I) → Candidate Goals</text>

    <!-- 3. Intentions Box -->
    <rect x="0" y="230" width="220" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="110" y="254" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Intentions / Commitments (I)</text>
    <text x="110" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Chosen goals + committed plan</text>
    <rect x="15" y="282" width="190" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="105" y="301" font-family="monospace" font-size="10" fill="#14532d" text-anchor="middle">Filter(B, D, I) → Next Intentions</text>
  </g>

  <!-- Right: Deliberation & Plan Execution Engine -->
  <g transform="translate(500, 60)">
    <rect width="260" height="325" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Practical Reasoning Engine</text>

    <!-- Plan Library -->
    <rect x="20" y="45" width="220" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="130" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Pre-compiled Plan Library</text>
    <text x="130" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Plans indexed by trigger events</text>

    <!-- Reconsideration Check -->
    <rect x="20" y="125" width="220" height="75" rx="6" fill="#fef2f2" stroke="#ef4444"/>
    <text x="130" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Intention Reconsideration</text>
    <text x="130" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Should agent drop intention?</text>
    <text x="130" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Achieved? • Impossible? • Obsolete?</text>

    <!-- Action Dispatcher -->
    <rect x="20" y="220" width="220" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="130" y="242" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Execute Next Action</text>
    <text x="130" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Pop action from current plan</text>
    <text x="130" y="276" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">act = head(plan(I))</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- Sensors to Beliefs -->
  <path d="M 145 145 L 215 110" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Beliefs down to Desires -->
  <path d="M 330 155 L 330 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Desires down to Intentions -->
  <path d="M 330 270 L 330 290" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Intentions to Deliberation -->
  <path d="M 440 335 L 495 335" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Action Dispatcher to Actuators -->
  <path d="M 500 320 L 470 375 L 145 330" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- CoALA Mapping Banner -->
  <rect x="30" y="390" width="740" height="24" rx="4" fill="#e2e8f0"/>
  <text x="400" y="406" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Modern LLM Mapping (CoALA): Beliefs = Context + Memory | Desires = User Prompt | Intentions = Plan / ToDo File</text>
</svg>

